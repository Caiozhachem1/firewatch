<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>FireWatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3s.5 2 2 2c0-3-1-5 2-9Z' fill='%23C8362E'/%3E%3C/svg%3E">
<style>
:root{--bg:#F5F5F0;--ink:#0A0A0A;--muted:#76766F;--line:#DFE3D8;--red:#C8362E;--green:#1D7A6A}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F0E;--ink:#F4F4F4;--muted:#8A8A86;--line:#2A2A28;--red:#E0493F;--green:#3BA48F}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;display:grid;place-items:center;padding:0 16px}
main{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
svg{width:34px;height:34px}
h1{font-size:19px;margin:0}
p{margin:0;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:p 1.2s ease-in-out infinite}
.off .dot{background:var(--red);animation:none}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
a{color:var(--green)}
</style>
</head>
<body>
<main id="m">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3s.5 2 2 2c0-3-1-5 2-9Z" fill="var(--red)"/></svg>
  <h1>Lazarus FireWatch</h1>
  <p id="s"><span class="dot"></span>Opening the live fire map…</p>
</main>
<script>
// Permanent entry point: forwards to wherever the FireWatch server currently runs.
// The server's address is kept in url.json by the server itself. Anything after "#" (for example
// "#/invite/<token>") is passed on as the path, and never leaves the browser before reaching FireWatch.
(async function () {
  const FALLBACK = "https://pig-proper-cook-infants.trycloudflare.com";
  const s = document.getElementById('s');
  async function current() {
    try {   // GitHub API: updates instantly (Pages itself can cache for ~10 min)
      const r = await fetch('https://api.github.com/repos/Caiozhachem1/firewatch/contents/url.json?ref=main', {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
      if (r.ok) { const j = await r.json(); if (j.url) return j.url; }
    } catch (e) {}
    try { const r = await fetch('url.json?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) { const j = await r.json(); if (j.url) return j.url; } } catch (e) {}
    return FALLBACK;
  }
  const base = (await current()).replace(/\/$/, '');
  let path = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
  if (!/^\/(invite|reset|magic|embed|login|account|admin)?([\/?].*)?$/.test(path)) path = '/';
  const target = base + path;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    await fetch(base + '/healthz', {mode: 'no-cors', signal: ctl.signal, cache: 'no-store'});
    location.replace(target);
  } catch (e) {
    document.getElementById('m').className = 'off';
    s.innerHTML = '<span class="dot"></span>FireWatch is offline right now. It usually comes back within a few minutes. <a href="">Try again</a>';
  }
})();
</script>
</body>
</html>
